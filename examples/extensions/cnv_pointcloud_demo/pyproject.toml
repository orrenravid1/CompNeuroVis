[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnv-pointcloud-demo"
version = "0.1.0"
description = "External CompNeuroVis widget conformance fixture"
requires-python = ">=3.11"
dependencies = ["compneurovis>=0.4.0a1"]

[project.entry-points."compneurovis.vispy_plugins"]
pointcloud = "cnv_pointcloud_demo.vispy:register"

[tool.setuptools.packages.find]
where = ["src"]
