site_name: CompNeuroVis
site_description: Interactive visualization for computational neuroscience.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - High-Level API: high-level-api.md
  - Third-Party Widgets: widget-authoring.md
  - Example Path: examples.md
  - Design Proposals:
      - Fast Surfaces: surface-performance-proposal.md
