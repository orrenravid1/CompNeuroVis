[build-system]
requires    = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name        = "compneurovis"
version     = "0.4.0a1"
description = "Interactive visualization toolkit for computational neuroscience simulations and data"
authors     = ["Orren Ravid"]
readme      = "README.md"
license     = "Apache-2.0"
repository  = "https://github.com/orrenravid1/CompNeuroVis"
packages    = [
  { include = "compneurovis", from = "src" }
]

[tool.poetry.dependencies]
python        = "^3.11"
numpy         = ">=1.20"
PyOpenGL      = "3.1.10"
PyQt6         = "6.9.1"
pyqtgraph     = "0.13.7"
scipy         = "1.16.0"
vispy         = "0.15.2"

# optional visualization extras
matplotlib    = { version = "^3.10", optional = true }

# optional notebook frontend
ipywidgets    = { version = "^8.1", optional = true }
cloudpickle   = { version = "^3.1", optional = true }

# optional simulator backends
neuron        = { version = "^8.2", optional = true }
jaxley        = { version = "^0.1", optional = true }

# optional contributor/docs/test toolchain
pytest        = { version = "^7.0", optional = true }
mkdocs        = { version = "^1.6.1", optional = true }
mkdocs-material = { version = "^9.7.6", optional = true }
ruff          = { version = "^0.4", optional = true }

[tool.poetry.extras]
matplotlib = ["matplotlib"]
notebook = ["ipywidgets", "cloudpickle"]
neuron  = ["neuron"]
jaxley  = ["jaxley"]
contrib = ["pytest", "mkdocs", "mkdocs-material", "ruff"]
all     = ["matplotlib", "ipywidgets", "cloudpickle", "neuron", "jaxley", "pytest", "mkdocs", "mkdocs-material", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
