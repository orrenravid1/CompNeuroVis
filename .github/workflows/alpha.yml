name: alpha

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      - name: Install alpha package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=2,<3"
          python -m pip install -e ".[contrib,neuron]"

      - name: Run golden-path validation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compile source and examples
        run: python -m compileall -q src examples

      - name: Check formatting and static hygiene
        run: python -m ruff check src tests examples

      - name: Validate package metadata and lock
        run: poetry check --lock

      - name: Build published docs
        run: python -m mkdocs build --strict

      - name: Build distributions
        run: poetry build
